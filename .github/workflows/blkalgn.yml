name: blkalgn Build

on:
  push:
    branches:
      - lbs
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
            binary_name: blkalgn-x86_64
          - arch: aarch64
            runner: ubuntu-22.04-arm
            binary_name: blkalgn-aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          cargo \
          clang \
          git \
          libbfd-dev \
          libbpf-dev \
          libjson-c-dev \
          llvm \
          make \
          pkg-config

      - name: Build blkalgn
        run: |
          cd libbpf-tools/
          make blkalgn -j$(nproc)
          chmod +x blkalgn
          mv blkalgn ${{ matrix.binary_name }}

      - name: Generate SHA256 checksum
        run: |
          cd libbpf-tools/
          sha256sum ${{ matrix.binary_name }} > \
          ${{ matrix.binary_name }}.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: |
            libbpf-tools/${{ matrix.binary_name }}
            libbpf-tools/${{ matrix.binary_name }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    strategy:
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            artifact_name: blkalgn-x86_64
          - arch: aarch64
            artifact_name: blkalgn-aarch64

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download Artifact for ${{ matrix.arch }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/

      - name: Verify SHA256 checksum for ${{ matrix.arch }}
        run: |
          find release/
          cd release
          cat ${{ matrix.artifact_name }}.sha256
          sha256sum --check ${{ matrix.artifact_name }}.sha256

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Generate Changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "## Release ${{ env.VERSION }}" > changelog.md
          echo "" >> changelog.md
          git log $PREV_TAG..HEAD -- libbpf-tools/blkalgn* --pretty=format:"- %s" >> changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "blkalgn ${{ env.VERSION }}"
          body_path: changelog.md
          files: |
            release/${{ matrix.artifact_name }}
            release/${{ matrix.artifact_name }}.sha256
          prerelease: false
          draft: false
